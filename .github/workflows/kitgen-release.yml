name: KitGen release

on:
  push:
    branches: [main, "feat/**"]
    tags: ["kitgen-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to package (for example 2.0.1)"
        required: false
        type: string

# Default is read-only. Only the isolated publish job gets contents:write.
permissions:
  contents: read

concurrency:
  group: kitgen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # BACKLOG #23 — "release.json đã khai bản mới, file cài đặt thì chưa có".
  #
  # `kit-gen/release.json` là NGUỒN SỰ THẬT mà installer và agent đọc, nhưng nó nằm
  # trong repo: push nhánh là cả đội thấy version mới NGAY, trong khi tarball chỉ tồn
  # tại sau khi job `publish` dưới đây chạy xong (~10-15 phút). Ai push nhánh trước khi
  # tag xanh là mở ra một cửa sổ mà UI mời cập nhật còn installer tải về 404 — đã cắn
  # người dùng thật ngày 14/08 14:28.
  #
  # Thứ tự đúng đã ghi ở runbook §7.4 (push tag TRƯỚC, đợi release, RỒI mới push nhánh).
  # Job này chỉ làm một việc: biến "quên thứ tự" từ một lỗi im lặng 15 phút của người
  # dùng cuối thành một dấu X đỏ trong vòng nửa phút của người phát hành.
  #
  # KHÔNG chạy trên ref tag: lúc đó archive ĐANG được job `publish` tạo ra, chưa có là
  # đương nhiên. Đây cũng KHÔNG phải điều kiện tiên quyết của `publish` — nó là chuông
  # báo, không phải cái khoá.
  # ═══════════════════════════════════════════════════════════════════════════
  verify-release-manifest:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release manifest must point at an archive that already exists
        shell: bash
        run: |
          set -eu
          version="$(node -p "require('./kit-gen/release.json').version")"
          url="$(node -p "require('./kit-gen/release.json').archive")"
          for asset in "$url" "$url.sha256"; do
            code="$(curl -sSL --head --retry 3 -o /dev/null -w '%{http_code}' "$asset" || echo 000)"
            [ "$code" = 200 ] || {
              echo "::error file=kit-gen/release.json::release.json khai $version nhưng $asset trả HTTP $code." >&2
              echo "Thứ tự phát hành đúng (runbook §7.4): push tag kitgen-v$version trước, đợi workflow tạo xong GitHub Release, RỒI mới push nhánh chứa release.json." >&2
              echo "Đẩy trước là mở ra cửa sổ mà UI mời cập nhật còn installer tải 404 (BACKLOG #23)." >&2
              exit 1
            }
          done
          echo "release.json → $version · archive + checksum đều đã có trên GitHub Releases."

  verify-and-package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kit-gen/webapp
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kit-gen/webapp/package-lock.json
      - run: npm ci
      - name: Verify installer service recovery
        run: |
          bash ../test/kitgen-run-env.test.sh
          bash ../test/kitgen-launchd-start.test.sh
          bash ../test/install-launchd.test.sh
          bash ../test/install-download.test.sh
          # Bộ ca này TỒN TẠI TỪ LÂU nhưng chưa lần nào được CI chạy — đúng kiểu lỗ hổng
          # "có test mà không ai gọi". Nó canh vòng đời stop/start/restart của dịch vụ.
          bash ../test/install-restart.test.sh
          # ĐỔI CHIỀU 16/09/2026. Ca cũ (install-python-runtime) canh đường "tải Python
          # cho đúng": pin cứng bản CPython, kiểm checksum, `pip --only-binary=:all:`
          # (thiếu cờ đó là ninja ăn hết RAM và treo máy người dùng thật). Engine nay là
          # JS nên đường ấy không còn, và thứ phải canh là chiều ngược lại: KHÔNG installer
          # nào được chạm tới Python nữa, và di sản đời cũ phải bị dọn.
          bash ../test/install-no-python.test.sh
          # Mọi ca engine cũ (gen-*.test.sh · engine-empty-array · slice-orientation)
          # đã xoá cùng `gen.sh`/`slice.py`. Chúng trích `run_one` từ chính engine bash;
          # thứ canh những nhánh ấy nay là `node ../agent/test-agent.mjs` ngay dưới
          # (suite-engine-gen · suite-engine-prompt · suite-engine-slice).
      # `verify:release` = nogen + typecheck + contrast + deadclass + test:release + build.
      # Đó là TOÀN BỘ cổng của webapp; đừng thêm bước `npm run <x>` nào vào đây mà không
      # mở `kit-gen/webapp/package.json` xem script ấy còn sống không — chính chỗ này đã
      # đỏ liên tục từ 10/09 vì workflow còn gọi `test:integration`, `playwright install`
      # và `test:e2e` sau khi commit 7488baa («dọn đợt 2») xoá cả ba: script, gói
      # @playwright/test lẫn thư mục `tests/e2e`. Luồng trình duyệt nay KHÔNG có máy canh
      # ở CI — đó là khoảng trống đã biết và đã chọn, không phải điều bị bỏ quên; nếu dựng
      # lại bộ e2e thì dựng lại luôn cả bước cache Chromium (không cache thì mỗi lượt tải
      # ~150MB, ngày 2026-08-18 CDN Playwright treo làm release 2.1.29 kẹt 40+ phút).
      - name: Verify web application
        run: npm run verify:release
      - name: Verify local agent
        run: node ../agent/test-agent.mjs
      - name: Resolve package version
        id: version
        working-directory: .
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          if [[ -n "$INPUT_VERSION" ]]; then version="$INPUT_VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/kitgen-v* ]]; then version="${GITHUB_REF#refs/tags/kitgen-v}"
          else version="$(node -p "require('./kit-gen/webapp/package.json').version")-${GITHUB_SHA::7}"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || { echo "Invalid version: $version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build source-free runtime
        working-directory: .
        run: bash kit-gen/scripts/build-runtime.sh '${{ steps.version.outputs.version }}' "$RUNNER_TEMP/release"
      - name: Verify and build easy-install bundle
        working-directory: .
        shell: bash
        run: |
          set -eu
          bash kit-gen/test/easy-install.test.sh
          chmod +x kit-gen/easy-install/*.command
          # ZIP DỰNG BẰNG `zip`, KHÔNG PHẢI HEREDOC PYTHON. Khối cũ là ~30 dòng
          # `zipfile` chỉ để đổi tên README-<nền tảng>.md thành README.md và giữ bit
          # thực thi. Sau khi cả sản phẩm đã bỏ Python, để lại một lời gọi python3 trong
          # chính workflow phát hành là giữ một tiền đề mà không ai còn khai — và người
          # đọc kế tiếp sẽ tưởng KitGen vẫn cần Python ở đâu đó.
          # `zip` của Info-ZIP giữ nguyên quyền trên Unix, nên bit +x của .command sống sót.
          rel="$RUNNER_TEMP/release"
          for plat in macos windows; do
            case "$plat" in
              macos)   files="install.command start-server.command stop-server.command uninstall.command" ;;
              windows) files="install.bat start-server.bat stop-server.bat uninstall.bat" ;;
            esac
            stage="$RUNNER_TEMP/easy-stage/$plat"
            rm -rf "$stage"; mkdir -p "$stage"
            cp "kit-gen/easy-install/README-$plat.md" "$stage/README.md"
            for f in $files; do
              [ -f "kit-gen/easy-install/$f" ] || { echo "::error::thieu kit-gen/easy-install/$f"; exit 1; }
              cp "kit-gen/easy-install/$f" "$stage/$f"
            done
            rm -f "$rel/kitgen-easy-install-$plat.zip"
            ( cd "$stage" && zip -q -X "$rel/kitgen-easy-install-$plat.zip" README.md $files )
            echo "built $rel/kitgen-easy-install-$plat.zip"
            unzip -l "$rel/kitgen-easy-install-$plat.zip"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: kitgen-runtime-${{ steps.version.outputs.version }}
          path: |
            ${{ runner.temp }}/release/*.tar.gz
            ${{ runner.temp }}/release/*.sha256
            ${{ runner.temp }}/release/kitgen-easy-install-macos.zip
            ${{ runner.temp }}/release/kitgen-easy-install-windows.zip
          if-no-files-found: error
          retention-days: 14

  # ═══════════════════════════════════════════════════════════════════════════
  #  CÀI THẬT TRÊN macOS VỚI PATH ĐÃ TƯỚC SẠCH — job này trước đây KHÔNG TỒN TẠI.
  #
  #  VÌ SAO: sự cố thật "install.sh thoát mã 127" chỉ xảy ra trên máy KHÔNG có Node
  #  hệ thống. `npm` là symlink tới `npm-cli.js` mang shebang `#!/usr/bin/env node`;
  #  Node riêng của KitGen nằm trong $KITGEN_HOME/tools/node/bin, KHÔNG có trong PATH
  #  ⇒ `env: node: No such file or directory` ⇒ 127 ngay ở bước cài Codex CLI.
  #  Máy nào có Node hệ thống thì thoát nạn — mà runner CI thì LUÔN có Node. Nên chừng
  #  nào chưa tước PATH, ca này là ca không thể đỏ.
  #
  #  PYTHON: KHÔNG CÒN LIÊN QUAN (16/09/2026). Bản trước phải mượn setup-python và
  #  truyền KITGEN_PYTHON3 để installer khỏi đi tải CPython ~24 MB giữa job. Installer
  #  nay không hỏi han gì về Python, nên job này khẳng định điều ngược lại: cài xong mà
  #  `tools/python` và `.venv` đều KHÔNG tồn tại.
  # ═══════════════════════════════════════════════════════════════════════════
  install-macos:
    name: Cai dat tren macOS (PATH tuoc sach)
    needs: verify-and-package
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kitgen-runtime-${{ needs.verify-and-package.outputs.version }}
          path: ${{ runner.temp }}/pkg
      # Nếu runner lỡ có `node` ngay trong PATH tối thiểu thì cả job này vô nghĩa —
      # phải ĐỎ ngay tại đây chứ không được xanh giả.
      - name: PATH toi thieu phai that su trong node
        shell: bash
        run: |
          set -u
          env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin /bin/sh -c '
            echo "PATH   = $PATH"
            echo "node   = $(command -v node    || echo "(khong co)")"
            echo "npm    = $(command -v npm     || echo "(khong co)")"
          '
          if env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin /bin/sh -c 'command -v node >/dev/null 2>&1'; then
            echo "::error::runner co san node NGAY TRONG PATH toi thieu - ca nay khong con la chan dung may nguoi dung, sua lai danh sach thu muc"
            exit 1
          fi
          echo "OK  PATH toi thieu khong co node (dung chan dung may nguoi dung)"

      # Cài THẬT, trong HOME tạm, PATH tối thiểu. `--no-start` để không đụng launchd
      # của runner; mọi bước còn lại (Node riêng, Codex CLI chính thức) đều chạy đủ —
      # đó mới là đoạn đường có bug.
      - name: Cai dat trong PATH toi thieu (khong co node)
        shell: bash
        run: |
          set -u
          tar="$(ls "$RUNNER_TEMP"/pkg/kitgen-runtime-*.tar.gz | head -1)"
          [ -f "$tar" ] || { echo "::error::khong thay tarball runtime trong artifact"; exit 1; }
          echo "goi: $tar"
          H="$RUNNER_TEMP/fakehome"
          mkdir -p "$H"
          log="$RUNNER_TEMP/install-macos.log"
          set +e
          env -i \
            HOME="$H" \
            PATH=/usr/bin:/bin:/usr/sbin:/sbin \
            KITGEN_HOME="$H/.kitgen" \
            bash kit-gen/install.sh \
              --archive "$tar" --workspace "$H/KitGen" --port 8899 --no-start > "$log" 2>&1
          code=$?
          set -e
          echo "--------- install.sh ---------"
          cat "$log"
          echo "------------------------------"
          rc=0
          if [ "$code" -ne 0 ]; then
            echo "::error::install.sh thoat ma $code trong PATH khong co node (ma 127 = npm khong tim thay node: xem dong PATH=\$(dirname \$NODE):\$PATH trong kit-gen/install.sh)"
            rc=1
          fi
          # Dau van tay CHINH XAC cua su co that. Bat rieng vi no noi thang nguyen nhan.
          if grep -q 'env: node: No such file or directory' "$log"; then
            echo "::error file=kit-gen/install.sh::npm chay bang shebang '#!/usr/bin/env node' ma Node rieng khong co trong PATH. Bo sung/giu dong PATH=\"\$(dirname \"\$NODE\"):\$PATH\" ngay sau khoi tai Node."
            rc=1
          fi
          # Phai di QUA duoc buoc Codex CLI, khong duoc dung truoc do. CON SO PHAI KHOP
          # `progress` cua install.sh: no in [1/6]..[6/6]. Hai dong nay tung do [3/7]/[7/7]
          # — mot so buoc khong con ton tai, nghia la ca nay DO mot thu khong bao gio in ra.
          grep -q '\[3/6\]' "$log" || { echo "::error::log khong den buoc [3/6] Codex CLI"; rc=1; }
          grep -q '\[6/6\]' "$log" || { echo "::error::log khong den buoc [6/6] - installer dung giua chung"; rc=1; }
          for f in "$H/.kitgen/tools/node/bin/node" \
                   "$H/.kitgen/current/agent/server.mjs" \
                   "$H/.kitgen/bin/kitgen"; do
            [ -e "$f" ] || { echo "::error::thieu $f"; rc=1; }
          done
          # Codex: tu 24/08/2026 chi con MOT duong cai — installer CHINH THUC cua
          # OpenAI (~/.local/bin/codex); duong npm da bo han (ban npm gen hong).
          [ -x "$H/.local/bin/codex" ] || { echo "::error::thieu $H/.local/bin/codex (codex chinh thuc)"; rc=1; }
          # ENGINE JS PHAI CO MAT, VA PYTHON PHAI KHONG. Day la ca duy nhat chay installer
          # THAT tren mot HOME trang, nen no la cho duy nhat phat hien duoc "van tai Python
          # o mot nhanh nao do" hay "van chep engine vao workspace".
          [ -f "$H/.kitgen/current/agent/engine/cli.mjs" ] \
            || { echo "::error::thieu cua vao engine JS trong ban da cai"; rc=1; }
          for bad in "$H/.kitgen/tools/python" "$H/KitGen/.venv" "$H/KitGen/.kitgen/engine"; do
            [ ! -e "$bad" ] || { echo "::error::installer van de lai $bad - KitGen chi con can Node"; rc=1; }
          done
          [ "$rc" -eq 0 ] && echo "OK  cai xong ma 0 trong PATH khong co node; Codex CLI chinh thuc da vao ~/.local/bin"
          exit $rc

      # Ca hồi quy cho sự cố "agent thoát câm": chạy CHÍNH server.mjs qua symlink
      # `current` bằng Node riêng. Bản chưa vá: Node giải symlink cho `import.meta.url`
      # nhưng không giải cho `process.argv[1]` ⇒ hai vế khác chuỗi ⇒ main() không chạy
      # ⇒ thoát MÃ 0, stdout 0 byte, không nghe cổng. Trên Windows triệu chứng y hệt
      # (junction), nên ca này canh hộ cả hai nền tảng ở chỗ rẻ nhất.
      - name: Agent chay qua symlink current phai lang nghe
        shell: bash
        run: |
          set -u
          H="$RUNNER_TEMP/fakehome"
          KG="$H/.kitgen"
          port=8899
          origin="http://127.0.0.1:$port"
          log="$RUNNER_TEMP/agent-symlink.log"
          [ -L "$KG/current" ] || { echo "::error::$KG/current khong phai symlink - ca hoi quy nay mat y nghia"; exit 1; }
          ls -l "$KG/current"
          : > "$log"
          env -i HOME="$H" PATH=/usr/bin:/bin KITGEN_HOME="$KG" \
            "$KG/tools/node/bin/node" "$KG/current/agent/server.mjs" \
            --workspace "$H/KitGen" --port "$port" --origin "$origin" > "$log" 2>&1 &
          pid=$!
          ok=0
          alive=1
          for i in $(seq 1 30); do
            sleep 1
            if ! kill -0 "$pid" 2>/dev/null; then alive=0; break; fi
            if curl -fsS -m 3 -H 'X-KitGen-Client: 1' -H "Origin: $origin" \
                 "$origin/health" -o "$RUNNER_TEMP/health.json" 2>/dev/null; then ok=1; break; fi
          done
          rc=0
          if [ "$alive" -eq 0 ]; then
            echo "::error file=kit-gen/agent/server.mjs::tien trinh agent THOAT thay vi lang nghe. Thoat ma 0 + stdout rong = bug isMainModule: so import.meta.url voi process.argv[1] bang chuoi, Node giai symlink cho ve dau chu khong giai cho ve sau."
            rc=1
          fi
          if [ "$ok" -ne 1 ]; then
            echo "::error::/health khong tra loi khi chay server.mjs qua symlink current"
            rc=1
          else
            echo "/health -> $(cat "$RUNNER_TEMP/health.json")"
            grep -q '"app":"kitgen-agent"' "$RUNNER_TEMP/health.json" || { echo "::error::/health: app != kitgen-agent"; rc=1; }
          fi
          bytes="$(wc -c < "$log" | tr -d ' ')"
          echo "stdout qua symlink: $bytes byte"
          if [ "$bytes" -le 0 ]; then
            echo "::error file=kit-gen/agent/server.mjs::stdout RONG - agent khong in noi mot dong banner (thoat cam) - xem isMainModule"
            rc=1
          else
            echo "--------- stdout agent ---------"
            cat "$log"
            echo "-------------------------------"
            grep -q 'kitgen-agent' "$log" || { echo "::error::stdout khong co dong banner 'kitgen-agent'"; rc=1; }
            grep -q 'protocol' "$log"     || { echo "::error::stdout khong co chu 'protocol' trong banner"; rc=1; }
          fi
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          [ "$rc" -eq 0 ] && echo "OK  agent lang nghe that su khi chay qua symlink current"
          exit $rc

      - name: Nhat ky khi hong
        if: failure()
        shell: bash
        run: |
          set +e
          for f in "$RUNNER_TEMP/install-macos.log" "$RUNNER_TEMP/agent-symlink.log"; do
            echo "--------- $f ---------"
            [ -f "$f" ] && tail -200 "$f" || echo "(khong co file)"
          done
          echo "--------- cay \$KITGEN_HOME ---------"
          find "$RUNNER_TEMP/fakehome/.kitgen" -maxdepth 2 2>/dev/null | head -60
          exit 0

  publish:
    if: startsWith(github.ref, 'refs/tags/kitgen-v')
    needs: verify-and-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kitgen-runtime-${{ needs.verify-and-package.outputs.version }}
          path: release-output
      - name: Check release payload
        run: |
          set -eu
          cd release-output
          test -f kitgen-easy-install-macos.zip
          test -f kitgen-easy-install-windows.zip
          test ! -e kitgen-easy-install.zip
          count=0
          for archive in ./*.tar.gz; do
            [ -f "$archive" ] || continue
            checksum="$archive.sha256"
            [ -f "$checksum" ] || { echo "Missing checksum for $archive" >&2; exit 1; }
            expected="$(awk 'NR == 1 { print $1 }' "$checksum")"
            actual="$(shasum -a 256 "$archive" | awk '{ print $1 }')"
            [ -n "$expected" ] && [ "$expected" = "$actual" ] || { echo "Checksum mismatch for $archive" >&2; exit 1; }
            count=$((count + 1))
          done
          [ "$count" -eq 1 ] || { echo "Expected exactly one runtime archive, found $count" >&2; exit 1; }
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-output/*.tar.gz
            release-output/*.sha256
            release-output/kitgen-easy-install-macos.zip
            release-output/kitgen-easy-install-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
