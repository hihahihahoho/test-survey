name: KitGen release

on:
  push:
    branches: [main, "feat/**"]
    tags: ["kitgen-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to package (for example 2.0.1)"
        required: false
        type: string

# Default is read-only. Only the isolated publish job gets contents:write.
permissions:
  contents: read

concurrency:
  group: kitgen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # BACKLOG #23 — "release.json đã khai bản mới, file cài đặt thì chưa có".
  #
  # `kit-gen/release.json` là NGUỒN SỰ THẬT mà installer và agent đọc, nhưng nó nằm
  # trong repo: push nhánh là cả đội thấy version mới NGAY, trong khi tarball chỉ tồn
  # tại sau khi job `publish` dưới đây chạy xong (~10-15 phút). Ai push nhánh trước khi
  # tag xanh là mở ra một cửa sổ mà UI mời cập nhật còn installer tải về 404 — đã cắn
  # người dùng thật ngày 14/08 14:28.
  #
  # Thứ tự đúng đã ghi ở runbook §7.4 (push tag TRƯỚC, đợi release, RỒI mới push nhánh).
  # Job này chỉ làm một việc: biến "quên thứ tự" từ một lỗi im lặng 15 phút của người
  # dùng cuối thành một dấu X đỏ trong vòng nửa phút của người phát hành.
  #
  # KHÔNG chạy trên ref tag: lúc đó archive ĐANG được job `publish` tạo ra, chưa có là
  # đương nhiên. Đây cũng KHÔNG phải điều kiện tiên quyết của `publish` — nó là chuông
  # báo, không phải cái khoá.
  # ═══════════════════════════════════════════════════════════════════════════
  verify-release-manifest:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release manifest must point at an archive that already exists
        shell: bash
        run: |
          set -eu
          version="$(node -p "require('./kit-gen/release.json').version")"
          url="$(node -p "require('./kit-gen/release.json').archive")"
          for asset in "$url" "$url.sha256"; do
            code="$(curl -sSL --head --retry 3 -o /dev/null -w '%{http_code}' "$asset" || echo 000)"
            [ "$code" = 200 ] || {
              echo "::error file=kit-gen/release.json::release.json khai $version nhưng $asset trả HTTP $code." >&2
              echo "Thứ tự phát hành đúng (runbook §7.4): push tag kitgen-v$version trước, đợi workflow tạo xong GitHub Release, RỒI mới push nhánh chứa release.json." >&2
              echo "Đẩy trước là mở ra cửa sổ mà UI mời cập nhật còn installer tải 404 (BACKLOG #23)." >&2
              exit 1
            }
          done
          echo "release.json → $version · archive + checksum đều đã có trên GitHub Releases."

  verify-and-package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kit-gen/webapp
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kit-gen/webapp/package-lock.json
      - run: npm ci
      - name: Verify installer service recovery
        run: |
          bash ../test/kitgen-run-env.test.sh
          bash ../test/kitgen-launchd-start.test.sh
          bash ../test/install-launchd.test.sh
          bash ../test/install-download.test.sh
      - name: Verify web application
        run: npm run verify:release
      - name: Verify integration contracts
        run: npm run test:integration
      - name: Verify local agent
        run: node ../agent/test-agent.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # --workers=1 LÀ CỐ Ý, KHÔNG PHẢI "cho chắc".
      # Hai ca @visual của trang Cài đặt đỏ NGẪU NHIÊN khi playwright chạy `fullyParallel`
      # trên runner CI; chạy nối tiếp thì luôn xanh. Đã tái hiện trên baseline KHÔNG có
      # patch nào ⇒ đây là flake của bộ e2e (nhiều tab cùng nói chuyện với một dev server
      # vite duy nhất), không phải hồi quy của bản phát hành. Một lượt release đỏ vì flake
      # tốn nhiều hơn vài phút chạy chậm.
      # GỠ CỜ NÀY KHI: root cause của 2 ca @visual đã sửa và bộ e2e xanh 10 lượt liên tiếp
      # ở chế độ song song (kiểm bằng `npx playwright test --repeat-each=10`).
      - name: Verify browser flows
        run: npm run test:e2e -- --workers=1
      - name: Resolve package version
        id: version
        working-directory: .
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          if [[ -n "$INPUT_VERSION" ]]; then version="$INPUT_VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/kitgen-v* ]]; then version="${GITHUB_REF#refs/tags/kitgen-v}"
          else version="$(node -p "require('./kit-gen/webapp/package.json').version")-${GITHUB_SHA::7}"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || { echo "Invalid version: $version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build source-free runtime
        working-directory: .
        run: bash kit-gen/scripts/build-runtime.sh '${{ steps.version.outputs.version }}' "$RUNNER_TEMP/release"
      - name: Verify and build easy-install bundle
        working-directory: .
        shell: bash
        run: |
          set -eu
          bash kit-gen/test/easy-install.test.sh
          chmod +x kit-gen/easy-install/*.command
          python3 - "$RUNNER_TEMP/release/kitgen-easy-install.zip" <<'PY'
          import stat
          import sys
          import zipfile
          from pathlib import Path

          root = Path("kit-gen/easy-install")
          names = [
              "README.md",
              "install.bat",
              "install.command",
              "start-server.bat",
              "start-server.command",
              "stop-server.bat",
              "stop-server.command",
              "uninstall.bat",
              "uninstall.command",
          ]
          missing = [name for name in names if not (root / name).is_file()]
          if missing:
              raise SystemExit("missing easy-install files: " + ", ".join(missing))
          destination = Path(sys.argv[1])
          with zipfile.ZipFile(destination, "w", compression=zipfile.ZIP_DEFLATED) as archive:
              for name in names:
                  path = root / name
                  info = zipfile.ZipInfo(name)
                  info.create_system = 3
                  info.date_time = (1980, 1, 1, 0, 0, 0)
                  info.external_attr = (stat.S_IMODE(path.stat().st_mode) & 0xFFFF) << 16
                  info.compress_type = zipfile.ZIP_DEFLATED
                  archive.writestr(info, path.read_bytes())
          print("built", destination)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kitgen-runtime-${{ steps.version.outputs.version }}
          path: |
            ${{ runner.temp }}/release/*.tar.gz
            ${{ runner.temp }}/release/*.sha256
            ${{ runner.temp }}/release/kitgen-easy-install.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/kitgen-v')
    needs: verify-and-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kitgen-runtime-${{ needs.verify-and-package.outputs.version }}
          path: release-output
      - name: Check release payload
        run: |
          set -eu
          cd release-output
          test -f kitgen-easy-install.zip
          count=0
          for archive in ./*.tar.gz; do
            [ -f "$archive" ] || continue
            checksum="$archive.sha256"
            [ -f "$checksum" ] || { echo "Missing checksum for $archive" >&2; exit 1; }
            expected="$(awk 'NR == 1 { print $1 }' "$checksum")"
            actual="$(shasum -a 256 "$archive" | awk '{ print $1 }')"
            [ -n "$expected" ] && [ "$expected" = "$actual" ] || { echo "Checksum mismatch for $archive" >&2; exit 1; }
            count=$((count + 1))
          done
          [ "$count" -eq 1 ] || { echo "Expected exactly one runtime archive, found $count" >&2; exit 1; }
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-output/*.tar.gz
            release-output/*.sha256
            release-output/kitgen-easy-install.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
