<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo «Mở túi - Khui quà» — Phaser 4 + Game UI Kit</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%}
  body{
    font-family:"Arial Rounded MT Bold","SF Pro Rounded",-apple-system,"Segoe UI",sans-serif;
    background:#14161d;color:#fff;
    display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px 10px 40px;
  }
  .switcher{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
  .switcher button{
    border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);cursor:pointer;
    font:600 13px/1 inherit;color:#fff;padding:8px 14px;border-radius:99px;
  }
  .switcher button[aria-pressed="true"]{background:#fff;color:#14161d;border-color:#fff}
  .hint{font-size:11.5px;color:rgba(255,255,255,.55);text-align:center;max-width:600px}
  .hint b{color:rgba(255,255,255,.8)}

  /* khung điện thoại chứa canvas Phaser + lớp DOM overlay */
  .phone{
    position:relative;width:min(400px,96vw);aspect-ratio:390/844;
    border-radius:34px;overflow:hidden;border:6px solid #000;
    box-shadow:0 24px 60px rgba(0,0,0,.55);background:#0a0c14;
  }
  #game{position:absolute;inset:0}
  #game canvas{width:100% !important;height:100% !important}

  /* ---------- DOM overlay (màn phụ + form) — phần "hybrid" ---------- */
  #dom{position:absolute;inset:0;z-index:10;display:none;flex-direction:column;
    background:rgba(4,10,26,.55);backdrop-filter:blur(6px)}
  #dom.show{display:flex}
  #dom .bar{display:flex;align-items:center;gap:10px;padding:14px 14px 8px}
  #dom .bar b{flex:1;text-align:center;font-size:16px;text-shadow:0 2px 4px rgba(0,0,0,.6)}
  #dom .bar button{
    border:0;background:rgba(255,255,255,.14);color:#fff;cursor:pointer;
    width:38px;height:38px;border-radius:50%;font-size:16px;font-weight:800;
  }
  #dom .cards{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:8px 14px 20px}
  .card{background:rgba(255,255,255,.95);color:#1c2333;border-radius:14px;padding:12px 14px;
    display:flex;align-items:center;gap:10px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
  .card .info{flex:1;min-width:0}
  .card b{font-size:13px;display:block}
  .card small{font-size:11px;color:#5b6474}
  .card img{width:46px;height:46px;object-fit:contain;flex:none}
  .card .bar-track{position:relative;height:10px;border-radius:99px;background:#dfe4ee;
    margin-top:8px;max-width:170px;overflow:hidden}
  .card .bar-fill{position:absolute;inset:0;right:auto;border-radius:99px;
    background:linear-gradient(180deg,#ffb056,#ff7a3c)}
  .card button{
    border:2px solid #2f6fed;background:#fff;color:#2f6fed;cursor:pointer;flex:none;
    font:800 11px/1 inherit;padding:9px 12px;border-radius:99px;
  }
  .card input{width:100%;border:1.5px solid #c8d0de;border-radius:10px;padding:9px 10px;
    font:600 13px/1.2 inherit;color:#1c2333;margin-top:8px}
  .card .primary{background:#e8342c;border-color:#e8342c;color:#fff}
</style>
</head>
<body>

<div class="switcher" id="switcher"></div>
<div class="hint">Chạy trên <b>Phaser 4.2</b> (open source, MIT) — kit AI-gen nạp bằng
<b>texture atlas trimmed</b> sinh tự động từ manifest. Đổi style = nạp atlas khác.
Form/danh sách là DOM overlay (hybrid). Cần mở qua http (npm run dev), không mở file:// được.</div>

<div class="phone">
  <div id="game"></div>
  <div id="dom">
    <div class="bar"><button id="domBack">‹</button><b id="domTitle"></b><button id="domClose">✕</button></div>
    <div class="cards" id="domCards"></div>
  </div>
</div>

<script src="vendor/phaser.min.js"></script>
<script>
"use strict";
/* =============================================================================
   Cấu hình chung
   ========================================================================== */
const STYLES = [["ipay", "Fintech xanh"], ["candy", "Kẹo ngọt"], ["tet", "Tết"]];
let STYLE = localStorage.getItem("kit-style") || "ipay";
const W = 390, H = 844, CX = W / 2;
const state = { turns: 3 };
const END_AT = Date.now() + (2 * 86400 + 11 * 3600 + 30 * 60) * 1000;

const kimg = n => `kits/${STYLE}/${n}.png`;

/* =============================================================================
   Boot: nạp trước track/fill để Preload có thanh progress thật
   ========================================================================== */
class Boot extends Phaser.Scene {
  constructor() { super("Boot"); }
  preload() {
    this.load.image("boot-track", kimg("07-progress-track"));
    this.load.image("boot-fill", kimg("08-progress-fill"));
  }
  create() { this.scene.start("Preload"); }
}

/* =============================================================================
   Preload: nạp atlas kit, thanh progress dùng chính track/fill của kit
   ========================================================================== */
class Preload extends Phaser.Scene {
  constructor() { super("Preload"); }
  preload() {
    this.cameras.main.setBackgroundColor("#0d1330");
    this.add.text(CX, H * 0.34, "MỞ TÚI\nKHUI QUÀ", {
      fontFamily: "Arial Rounded MT Bold, Arial", fontSize: 44, fontStyle: "900",
      color: "#ffffff", align: "center", stroke: "#0a1a4a", strokeThickness: 8
    }).setOrigin(0.5);

    const bw = 280;
    const track = this.add.image(CX, H * 0.62, "boot-track");
    track.setDisplaySize(bw, bw * track.height / track.width);
    const fill = this.add.image(CX, H * 0.62, "boot-fill");
    fill.setDisplaySize(bw, bw * fill.height / fill.width);
    const pct = this.add.text(CX, H * 0.62 + 46, "0%", {
      fontFamily: "Arial", fontSize: 15, fontStyle: "bold", color: "#cfe0ff"
    }).setOrigin(0.5);

    this.load.on("progress", p => {
      fill.setCrop(0, 0, fill.width * p, fill.height);
      pct.setText(Math.round(p * 100) + "%");
    });

    this.load.atlas("kit", `kits/${STYLE}/atlas.png`, `kits/${STYLE}/atlas.json`);
  }
  create() { this.time.delayedCall(250, () => this.scene.start("Home")); }
}

/* =============================================================================
   Tiện ích dựng UI từ atlas
   ========================================================================== */
function sprite(scene, x, y, frame) { return scene.add.image(x, y, "kit", frame); }

/* Nền full-bleed: asset bg bị trim (model chừa mép trong ô) nên setDisplaySize
   theo canvas sẽ hở viền. Scale theo vùng CUT kiểu cover + bù tâm lệch do trim. */
function coverBG(scene, frameName) {
  const img = scene.add.image(0, 0, "kit", frameName);
  const f = img.frame;
  const s = Math.max(W / f.cutWidth, H / f.cutHeight);
  img.setScale(s);
  img.setPosition(
    CX - (f.x + f.cutWidth / 2 - f.realWidth / 2) * s,
    H / 2 - (f.y + f.cutHeight / 2 - f.realHeight / 2) * s
  );
  return img;
}

function fitW(img, w) { img.setScale(w / img.width); return img; }
function fitH(img, h) { img.setScale(h / img.height); return img; }

function label(scene, x, y, text, size, opts = {}) {
  return scene.add.text(x, y, text, Object.assign({
    fontFamily: "Arial Rounded MT Bold, Arial", fontSize: size, fontStyle: "900",
    color: "#ffffff", align: "center",
    stroke: opts.stroke ?? "#00000055", strokeThickness: opts.strokeThickness ?? 0,
    shadow: { offsetY: 2, color: "#00000088", blur: 4, fill: true }
  }, opts)).setOrigin(0.5);
}

function pillButton(scene, x, y, frame, w, text, fontSize, onTap) {
  const c = scene.add.container(x, y);
  const img = fitW(scene.add.image(0, 0, "kit", frame), w);
  const t = label(scene, 0, 0, text, fontSize);
  c.add([img, t]);
  c.setSize(w, img.displayHeight);
  c.setInteractive({ useHandCursor: true });
  c.on("pointerdown", () => scene.tweens.add({ targets: c, scale: 0.94, duration: 70, yoyo: true }));
  if (onTap) c.on("pointerup", onTap);
  return c;
}

const PACK_TINTS = [0xffffff, 0x9fd0ff, 0xffc2d8, 0xffe29a, 0xb9f3c9, 0xd9c6ff];

/* =============================================================================
   Home
   ========================================================================== */
class Home extends Phaser.Scene {
  constructor() { super("Home"); }
  create() {
    coverBG(this, "25-bg-main");

    label(this, CX, 92, "MỞ TÚI KHUI QUÀ", 34, { stroke: "#0a1a4a", strokeThickness: 8 });
    label(this, CX, 128, "Cùng iPAY săn quà mỗi ngày", 13);

    this.buildCountdown(180);

    // khay + 6 túi
    const board = fitW(sprite(this, CX, 430, "22-board-panel"), 330);
    this.packs = [];
    const gx = [-92, 0, 92], gy = [385, 480];
    for (let i = 0; i < 6; i++) {
      const p = fitH(sprite(this, CX + gx[i % 3], gy[(i / 3) | 0], "20-game-object-closed"), 105);
      p.setTint(PACK_TINTS[i]);
      p.setInteractive({ useHandCursor: true });
      p.on("pointerup", () => this.tryPlay());
      this.packs.push(p);
    }

    fitH(sprite(this, 56, 700, "17-mascot-idle"), 190);

    pillButton(this, CX, 626, "01-btn-pill-red", 250, "MỞ TÚI NGAY", 25, () => this.tryPlay());
    this.turnsTxt = label(this, CX, 676, "", 13);
    this.updateTurns();

    this.buildTabbar("home");
  }

  buildCountdown(y) {
    const units = ["ngày", "giờ", "phút", "giây"];
    this.cdTexts = [];
    const xs = [CX - 117, CX - 39, CX + 39, CX + 117];
    xs.forEach((x, i) => {
      fitH(sprite(this, x, y, "11-digit-plate"), 52);
      this.cdTexts.push(label(this, x, y, "00", 20));
      label(this, x, y + 40, units[i], 10);
      if (i) label(this, (x + xs[i - 1]) / 2, y, ":", 20);
    });
    const tick = () => {
      let s = Math.max(0, Math.floor((END_AT - Date.now()) / 1000));
      const d = [Math.floor(s / 86400), Math.floor(s / 3600) % 24, Math.floor(s / 60) % 60, s % 60];
      this.cdTexts.forEach((t, i) => t.setText(String(d[i]).padStart(2, "0")));
    };
    tick();
    this.time.addEvent({ delay: 1000, loop: true, callback: tick });
  }

  buildTabbar(active) {
    const tabs = [["home", "Trang chủ", "🏠"], ["task", "Nhiệm vụ", "📋"],
                  ["gift", "Giỏ quà", "🎁"], ["hist", "Lịch sử", "🕘"]];
    tabs.forEach(([id, name, icon], i) => {
      const x = 57 + i * 92, y = H - 52;
      const chip = fitW(sprite(this, x, y, id === active ? "06-tab-chip-active" : "05-tab-chip-idle"), 72);
      label(this, x, y - 10, icon, 18);
      label(this, x, y + 16, name, 9.5);
      const hit = this.add.zone(x, y, 86, 84).setInteractive({ useHandCursor: true });
      hit.on("pointerup", () => id === "home" ? null : openDom(id));
    });
  }

  updateTurns() { this.turnsTxt.setText(`Còn ${state.turns} lượt hôm nay`); }

  tryPlay() {
    if (state.turns <= 0) return this.noTurns();
    this.scene.start("Play");
  }

  noTurns() {
    const dim = this.add.rectangle(CX, H / 2, W, H, 0x020a1e, 0.72).setInteractive();
    const c = this.add.container(CX, H / 2 - 20);
    const panel = fitW(this.add.image(0, 0, "kit", "09-popup-panel-short"), 320);
    const ribbon = fitW(this.add.image(0, -panel.displayHeight / 2, "kit", "10-popup-ribbon"), 230);
    // pose buồn từ sheet pose (kit mới); kit cũ chưa có thì rơi về mascot thường
    const sadFrame = this.textures.get("kit").has("32-pose-sad") ? "32-pose-sad" : "19-mascot-celebrate";
    const mc = fitH(this.add.image(0, -26, "kit", sadFrame), 130);
    c.add([panel, ribbon, label(this, 0, -panel.displayHeight / 2, "HẾT LƯỢT", 17), mc,
           label(this, 0, 58, "Bạn đã dùng hết lượt hôm nay.\nLàm nhiệm vụ để nhận thêm lượt nhé!", 12.5)]);
    const btn = pillButton(this, 0, panel.displayHeight / 2 + 6, "02-btn-pill-blue", 150, "NHIỆM VỤ", 14,
      () => { dim.destroy(); c.destroy(); openDom("task"); });
    c.add(btn);
    dim.on("pointerup", () => { dim.destroy(); c.destroy(); });
  }
}

/* =============================================================================
   Play: chọn túi → mở → kết quả
   ========================================================================== */
const PRIZES = [
  { art: "14-reward-voucher",   title: "CHÚC MỪNG!", body: "Bạn nhận được 1 voucher ưu đãi.\nQuà đã vào Giỏ quà của bạn." },
  { art: "15-reward-giftbox",   title: "CHÚC MỪNG!", body: "Bạn nhận được 1 phần quà.\nĐiền địa chỉ để nhận hàng nhé." },
  { art: "32-pose-sad",         title: "TIẾC QUÁ!",  body: "Chúc bạn may mắn lần sau.\nLàm nhiệm vụ để có thêm lượt.", lose: true }
];

class Play extends Phaser.Scene {
  constructor() { super("Play"); }
  create() {
    coverBG(this, "26-bg-blur");
    label(this, CX, 150, "Chọn một túi may mắn", 20, { stroke: "#0a1a4a", strokeThickness: 6 });

    fitW(sprite(this, CX, 430, "22-board-panel"), 330);
    const gx = [-92, 0, 92], gy = [385, 480];
    this.packs = [];
    for (let i = 0; i < 6; i++) {
      const p = fitH(sprite(this, CX + gx[i % 3], gy[(i / 3) | 0], "20-game-object-closed"), 105);
      p.setTint(PACK_TINTS[i]);
      p.setInteractive({ useHandCursor: true });
      p.on("pointerup", () => this.choose(i));
      this.packs.push(p);
    }
    this.mascot = fitH(sprite(this, W - 52, H - 160, "18-mascot-peek"), 200);
  }

  choose(i) {
    this.packs.forEach((p, j) => {
      p.disableInteractive();
      if (j !== i) this.tweens.add({ targets: p, alpha: 0.15, scale: p.scale * 0.85, duration: 250 });
    });
    const p = this.packs[i];
    this.tweens.add({
      targets: p, x: CX, y: 400, scale: 260 / p.height * p.scale / (p.displayHeight / p.height),
      duration: 420, ease: "Back.Out",
      onComplete: () => {
        label(this, CX, 170, "Chạm để mở túi!", 16);
        p.setInteractive({ useHandCursor: true });
        p.once("pointerup", () => this.open(p));
      }
    });
  }

  open(p) {
    const burst = sprite(this, p.x, p.y, "16-fx-burst").setBlendMode(Phaser.BlendModes.ADD)
      .setAlpha(0).setScale(0.4);
    burst.setDepth(p.depth - 1);
    p.setTexture("kit", "21-game-object-open");
    this.cameras.main.flash(220, 255, 255, 220);
    this.tweens.add({ targets: burst, alpha: 1, scale: 1.6, angle: 25, duration: 500, ease: "Cubic.Out" });
    state.turns--;
    this.time.delayedCall(620, () => this.result());
  }

  result() {
    const prize = PRIZES[(Math.random() * PRIZES.length) | 0];
    this.add.rectangle(CX, H / 2, W, H, 0x020a1e, 0.74).setInteractive();

    const c = this.add.container(CX, H / 2 + 500);   // trượt từ dưới lên
    const panel = fitW(this.add.image(0, 0, "kit", "24-popup-panel-tall"), 320);
    const ph = panel.displayHeight;
    const ribbon = fitW(this.add.image(0, -ph / 2, "kit", "10-popup-ribbon"), 240);
    const burst = this.add.image(0, -ph * 0.12, "kit", "16-fx-burst")
      .setBlendMode(Phaser.BlendModes.ADD).setScale(0.9);
    const art = fitH(this.add.image(0, -ph * 0.12, "kit", prize.art), 170);
    c.add([panel, burst, art, ribbon,
           label(this, 0, -ph / 2, prize.title, 17),
           label(this, 0, ph * 0.22, prize.body, 13)]);
    c.add(pillButton(this, -80, ph / 2 + 4, "02-btn-pill-blue", 148, "GIỎ QUÀ", 14,
      () => { openDom("gift"); }));
    c.add(pillButton(this, 80, ph / 2 + 4, "01-btn-pill-red", 148, "TIẾP TỤC", 14,
      () => this.scene.start(state.turns > 0 ? "Play" : "Home")));
    // trúng giải: mascot ăn mừng ngó vào từ mép panel (trượt thì ảnh giữa đã là pose buồn)
    if (!prize.lose && this.textures.get("kit").has("31-pose-cheer"))
      c.add(fitH(this.add.image(-152, ph / 2 - 46, "kit", "31-pose-cheer"), 150));
    this.tweens.add({ targets: c, y: H / 2 - 14, duration: 460, ease: "Back.Out" });
    this.tweens.add({ targets: burst, angle: 360, duration: 14000, repeat: -1 });
  }
}

/* =============================================================================
   Khởi tạo game + switcher + DOM overlay
   ========================================================================== */
let game;
function boot() {
  if (game) game.destroy(true);
  document.getElementById("game").innerHTML = "";
  game = window.game = new Phaser.Game({
    type: Phaser.AUTO,
    parent: "game",
    width: W, height: H,
    backgroundColor: "#0d1330",
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: [Boot, Preload, Home, Play]
  });
}

const switcher = document.getElementById("switcher");
STYLES.forEach(([id, name]) => {
  const b = document.createElement("button");
  b.textContent = name;
  b.dataset.s = id;
  b.setAttribute("aria-pressed", String(id === STYLE));
  b.onclick = () => {
    STYLE = id;
    localStorage.setItem("kit-style", id);
    switcher.querySelectorAll("button").forEach(x =>
      x.setAttribute("aria-pressed", String(x.dataset.s === id)));
    closeDom();
    boot();
  };
  switcher.appendChild(b);
});

/* ---------- DOM overlay (hybrid): màn phụ + form nhận quà ---------- */
const dom = document.getElementById("dom");
const domCards = document.getElementById("domCards");
const domTitle = document.getElementById("domTitle");
document.getElementById("domClose").onclick = closeDom;
document.getElementById("domBack").onclick = closeDom;
function closeDom() { dom.classList.remove("show"); }

function openDom(tab) {
  const titles = { task: "Nhiệm vụ", gift: "Giỏ quà của bạn", hist: "Lịch sử mở túi" };
  domTitle.textContent = titles[tab];
  let html = "";
  if (tab === "task") {
    html = [["Đăng nhập mỗi ngày", "1/1 — hoàn thành", 100, "NHẬN"],
            ["Chuyển tiền 3 lần", "2/3 — sắp xong", 66, "THỰC HIỆN"],
            ["Mời 1 người bạn", "0/1", 0, "THỰC HIỆN"]].map(([t, d, p, btn]) => `
      <div class="card"><div class="info"><b>${t}</b><small>${d}</small>
        <div class="bar-track"><div class="bar-fill" style="width:${p}%"></div></div></div>
        <button onclick="addTurn()">${btn}</button></div>`).join("");
    html += `<div class="card"><img src="${kimg("12-piece-active")}"><img src="${kimg("12-piece-active")}">
      <img src="${kimg("13-piece-locked")}"><img src="${kimg("13-piece-locked")}">
      <div class="info"><b>Sưu tập mảnh ghép</b><small>Đủ 4 mảnh đổi quà lớn — đã có 2/4</small></div></div>`;
  } else if (tab === "gift") {
    html = `
      <div class="card"><img src="${kimg("14-reward-voucher")}">
        <div class="info"><b>Voucher ưu đãi 50K</b><small>HSD: 29/02/2026</small></div>
        <button>DÙNG NGAY</button></div>
      <div class="card"><img src="${kimg("15-reward-giftbox")}">
        <div class="info"><b>Phần quà may mắn — điền địa chỉ nhận</b>
          <input placeholder="Họ tên người nhận">
          <input placeholder="Số điện thoại" inputmode="tel">
          <input placeholder="Địa chỉ nhận hàng"></div></div>
      <div class="card" style="justify-content:center">
        <button class="primary" onclick="closeDom()">XÁC NHẬN</button></div>`;
  } else {
    html = [["Hôm nay 09:41", "Trúng voucher ưu đãi", "14-reward-voucher"],
            ["Hôm qua 20:15", "Chúc bạn may mắn", "19-mascot-celebrate"],
            ["Hôm qua 08:02", "Trúng phần quà", "15-reward-giftbox"]].map(([t, d, ic]) => `
      <div class="card"><img src="${kimg(ic)}">
        <div class="info"><b>${d}</b><small>${t}</small></div></div>`).join("");
  }
  domCards.innerHTML = html;
  dom.classList.add("show");
}
function addTurn() {
  state.turns++;
  const home = game.scene.getScene("Home");
  if (home && home.scene.isActive()) home.updateTurns();
  closeDom();
}

boot();

/* =============================================================================
   Cầu nối CANVAS → FIGMA: dựng lại scene đang chạy thành DOM.

   Canvas là hộp đen với mọi DOM capturer (html.to.design, figma-h2d) — chụp
   canvas chỉ ra MỘT ảnh bẹt. Nhưng Phaser biết hết display list: sprite nào,
   frame atlas nào, toạ độ, scale, alpha, text gì. Hàm này walk display list
   của scene đang active và dựng một bản DOM tương đương:
     · Image (atlas "kit") → <div> crop đúng vùng cutX/cutY của atlas.png
       (kể cả trim offset spriteSourceSize) — mỗi sprite một layer
     · Text → <div> đúng font/size/màu — thành text layer thật
     · Rectangle (overlay mờ) → <div> nền rgba
   figma-export/capture.mjs gọi hàm này qua playwright rồi đưa replica cho
   figma-h2d chụp ra IR. KHÔNG dùng cho gameplay — chỉ để export.
   ========================================================================== */
/* Nướng (frame × tint) thành data-URL crop riêng — dùng chung cho cả
   __figmaDOM lẫn __figmaSVG. Tint của Phaser nướng thẳng vào ảnh
   (multiply + destination-in giữ alpha). Cache theo frame|tint. */
const __baked = new Map();
function __bakeFrame(f, tint) {
  const key = f.name + "|" + (tint ?? "");
  if (__baked.has(key)) return __baked.get(key);
  const atlasImg = game.textures.get("kit").getSourceImage();
  const c = document.createElement("canvas");
  c.width = f.cutWidth; c.height = f.cutHeight;
  const ctx = c.getContext("2d");
  ctx.drawImage(atlasImg, f.cutX, f.cutY, f.cutWidth, f.cutHeight,
                0, 0, f.cutWidth, f.cutHeight);
  if (tint != null && tint !== 0xffffff) {
    ctx.globalCompositeOperation = "multiply";
    ctx.fillStyle = "#" + tint.toString(16).padStart(6, "0");
    ctx.fillRect(0, 0, c.width, c.height);
    ctx.globalCompositeOperation = "destination-in";
    ctx.drawImage(atlasImg, f.cutX, f.cutY, f.cutWidth, f.cutHeight,
                  0, 0, f.cutWidth, f.cutHeight);
  }
  const url = c.toDataURL("image/png");
  __baked.set(key, url);
  return url;
}

window.__figmaDOM = function () {
  const scene = ["Play", "Home", "Preload"].map(k => game.scene.getScene(k))
    .find(s => s && s.scene.isActive());
  if (!scene) throw new Error("không có scene active");

  const atlasTex = game.textures.get("kit");

  const root = document.createElement("div");
  root.id = "figma-canvas-root";
  root.style.cssText = `position:fixed;left:0;top:0;width:${W}px;height:${H}px;` +
    "overflow:hidden;background:#0d1330;z-index:-1;font-family:Arial";
  document.body.appendChild(root);

  const put = el => root.appendChild(el);

  function walk(list, ox, oy, sx, sy, alpha) {
    for (const go of list) {
      if (!go.visible) continue;
      const a = alpha * (go.alpha ?? 1);
      if (go.type === "Container") {
        walk(go.list, ox + go.x * sx, oy + go.y * sy, sx * go.scaleX, sy * go.scaleY, a);
        continue;
      }
      const x = ox + go.x * sx, y = oy + go.y * sy;

      if (go.type === "Image" && go.frame && go.frame.texture === atlasTex) {
        const f = go.frame;
        const gsx = go.scaleX * sx, gsy = go.scaleY * sy;
        const left = x - f.realWidth * gsx * go.originX + f.x * gsx;  // f.x/f.y = trim offset
        const top = y - f.realHeight * gsy * go.originY + f.y * gsy;
        const tint = (go.tintTopLeft ?? 0xffffff) !== 0xffffff ? go.tintTopLeft : null;
        const d = document.createElement("div");
        d.dataset.frame = f.name;
        d.style.cssText =
          `position:absolute;left:${left.toFixed(1)}px;top:${top.toFixed(1)}px;` +
          `width:${(f.cutWidth * gsx).toFixed(1)}px;height:${(f.cutHeight * gsy).toFixed(1)}px;` +
          `background-image:url("${__bakeFrame(f, tint)}");` +
          `background-size:100% 100%;` +
          `opacity:${a.toFixed(3)}`;
        put(d);
      } else if (go.type === "Text") {
        const st = go.style;
        const d = document.createElement("div");
        d.textContent = go.text;
        d.style.cssText =
          `position:absolute;left:${(x - go.displayWidth * go.originX).toFixed(1)}px;` +
          `top:${(y - go.displayHeight * go.originY).toFixed(1)}px;` +
          `font-size:${parseFloat(st.fontSize)}px;font-weight:900;` +
          `font-family:${st.fontFamily};color:${st.color};` +
          `white-space:pre-line;text-align:center;line-height:1.15;` +
          `width:${go.displayWidth.toFixed(1)}px;opacity:${a.toFixed(3)}`;
        put(d);
      } else if (go.type === "Rectangle") {
        const d = document.createElement("div");
        const rw = go.width * go.scaleX * sx, rh = go.height * go.scaleY * sy;
        const c = go.fillColor ?? 0, fa = (go.fillAlpha ?? 1) * a;
        d.style.cssText =
          `position:absolute;left:${(x - rw * go.originX).toFixed(1)}px;` +
          `top:${(y - rh * go.originY).toFixed(1)}px;width:${rw.toFixed(1)}px;height:${rh.toFixed(1)}px;` +
          `background:rgba(${(c >> 16) & 255},${(c >> 8) & 255},${c & 255},${fa.toFixed(3)})`;
        put(d);
      }
    }
  }
  walk(scene.children.list, 0, 0, 1, 1, 1);
  return root;
};

/* Cùng nguồn display list nhưng xuất SVG — đường "paste vào Figma không plugin"
   ngay hôm nay: Figma parse SVG trên clipboard thành node thật (mỗi element một
   layer, <text> thành text layer). Chưa có Auto Layout như đường Kiwi, nhưng
   test bàn giao được ngay.
   Kỹ thuật crop atlas không phình file: atlas nhúng MỘT lần trong <defs>, mỗi
   frame một <symbol viewBox="cutX cutY w h"><use #atlas></symbol> — viewBox
   của symbol chính là cửa sổ crop; sprite chỉ là <use> nhẹ. */
window.__figmaSVG = async function () {
  const scene = ["Play", "Home", "Preload"].map(k => game.scene.getScene(k))
    .find(s => s && s.scene.isActive());
  if (!scene) throw new Error("không có scene active");

  /* Mỗi (frame × tint) nướng MỘT lần thành data-URL crop riêng (__bakeFrame).
     Không dùng <symbol>/<use> crop chung atlas: Chrome không clip nội dung
     symbol khi lồng <use> → sprite kéo theo hàng xóm trong atlas tràn ra (đã
     dính). Crop riêng còn cho phép nướng tint của Phaser vào ảnh luôn. */
  const bake = __bakeFrame;

  const esc = t => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const body = [];

  function walk(list, ox, oy, sx, sy, alpha) {
    for (const go of list) {
      if (!go.visible) continue;
      const a = alpha * (go.alpha ?? 1);
      if (go.type === "Container") {
        walk(go.list, ox + go.x * sx, oy + go.y * sy, sx * go.scaleX, sy * go.scaleY, a);
        continue;
      }
      const x = ox + go.x * sx, y = oy + go.y * sy;
      if (go.type === "Image" && go.frame && go.frame.texture.key === "kit") {
        const f = go.frame;
        const gsx = go.scaleX * sx, gsy = go.scaleY * sy;
        const left = x - f.realWidth * gsx * go.originX + f.x * gsx;
        const top = y - f.realHeight * gsy * go.originY + f.y * gsy;
        const tint = (go.tintTopLeft ?? 0xffffff) !== 0xffffff ? go.tintTopLeft : null;
        const url = bake(f, tint);
        body.push(`<image href="${url}" x="${left.toFixed(1)}" y="${top.toFixed(1)}" ` +
          `width="${(f.cutWidth * gsx).toFixed(1)}" height="${(f.cutHeight * gsy).toFixed(1)}" ` +
          `opacity="${a.toFixed(3)}" data-frame="${f.name}"/>`);
      } else if (go.type === "Text") {
        const st = go.style;
        const size = parseFloat(st.fontSize);
        const lines = String(go.text).split("\n");
        const lh = size * 1.15;
        const cx0 = x + go.displayWidth * (0.5 - go.originX);
        const ty0 = y - go.displayHeight * go.originY + size * 0.85;
        lines.forEach((ln, i) => {
          body.push(`<text x="${cx0.toFixed(1)}" y="${(ty0 + i * lh).toFixed(1)}" ` +
            `text-anchor="middle" font-family="Arial" font-weight="900" ` +
            `font-size="${size}" fill="${st.color}" opacity="${a.toFixed(3)}">${esc(ln)}</text>`);
        });
      } else if (go.type === "Rectangle") {
        const rw = go.width * go.scaleX * sx, rh = go.height * go.scaleY * sy;
        const c = go.fillColor ?? 0, fa = (go.fillAlpha ?? 1) * a;
        body.push(`<rect x="${(x - rw * go.originX).toFixed(1)}" y="${(y - rh * go.originY).toFixed(1)}" ` +
          `width="${rw.toFixed(1)}" height="${rh.toFixed(1)}" ` +
          `fill="rgb(${(c >> 16) & 255},${(c >> 8) & 255},${c & 255})" fill-opacity="${fa.toFixed(3)}"/>`);
      }
    }
  }
  walk(scene.children.list, 0, 0, 1, 1, 1);

  return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" ` +
    `viewBox="0 0 ${W} ${H}">${body.join("")}</svg>`;
};
</script>
</body>
</html>
