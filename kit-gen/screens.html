<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<title>Kit Screens — màn hình lắp từ element</title>
<!-- ============================================================================
  screens.html — preview TĨNH các màn cơ bản của mini-game, lắp 100% từ element
  đã slice trong kits/<kit>/tight/ + manifest.json:
    Home · Bảng xếp hạng · Mở quà · Mở lì xì
  · Panel / nút / hàng BXH co giãn bằng 9-SLICE insets trong manifest (không vỡ nét).
  · Text là DOM overlay (asset không chữ theo contract) — sang Figma thành text node.
  · Mỗi màn 1 nút copy Figma (figma-h2d), hoặc copy cả 4 màn một phát.
  Mở: http://localhost:8125/kit-gen/screens.html?kit=ipay
============================================================================ -->
<style>
  * { box-sizing: border-box; margin: 0 }
  body { background: #14161f; color: #e8eaf2; font: 13px/1.5 system-ui; padding: 20px }
  header { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 16px }
  h1 { font-size: 15px; margin-right: 8px }
  select, button { background: #262b3a; color: #fff; border: 1px solid #3a4157;
                   border-radius: 8px; padding: 7px 12px; font: 700 12px system-ui; cursor: pointer }
  button.blue { background: #2f6fed; border-color: #2f6fed }
  #msg { color: #9fd0a0; font-size: 12px }
  .shots { display: flex; gap: 22px; flex-wrap: wrap; align-items: flex-start }
  .wrap { display: flex; flex-direction: column; gap: 8px }
  .wrap .cap { display: flex; align-items: center; gap: 8px; font-weight: 700 }
  .screen { position: relative; width: 400px; height: 600px; overflow: hidden;
            border-radius: 18px; background: #0d0f16; flex: none }
  .screen img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover }
  .dim { position: absolute; inset: 0; background: rgba(4, 10, 26, .55); backdrop-filter: blur(5px) }
  .it { position: absolute; transform: translate(-50%, -50%); display: flex;
        align-items: center; justify-content: center }
  .it > img { width: 100%; height: 100%; display: block }
  .it .tx { position: absolute; color: #fff; font-weight: 800; text-align: center;
            text-shadow: 0 2px 6px rgba(0, 0, 0, .45); white-space: pre-line }
  .free { position: absolute; transform: translate(-50%, -50%); color: #fff; font-weight: 800;
          text-align: center; text-shadow: 0 2px 8px rgba(0, 0, 0, .55); white-space: pre-line }
</style>
<body>
<header>
  <h1>🖼 Màn hình lắp từ kit</h1>
  <select id="kitSel"></select>
  <select id="charSel" title="character dùng trong các màn"></select>
  <button class="blue" id="copyAll">📋 Copy CẢ 4 MÀN ra Figma</button>
  <span id="msg">các màn lắp từ kits/&lt;kit&gt;/tight — panel/nút co giãn bằng 9-slice</span>
</header>
<div class="shots" id="shots"></div>

<script src="figma-export/figma-h2d.global.js"></script>
<script>
"use strict";
const $ = s => document.querySelector(s);
const qs = new URLSearchParams(location.search);
let M, KIT, AM, CHAR;

/* asset theo tên (không .png); null nếu kit không có element đó → màn tự bỏ qua */
const A = n => AM[n] ?? null;
const src = n => `kits/${KIT}/tight/${n}.png`;

/* khung THÂN (safe zone) của element trong toạ độ ảnh tight — contract slice đảm bảo
   thân nằm đúng khung này, trang trí (tia sáng, hoa...) được tràn ra ngoài */
function safeOf(a) {
  return a.safe
    ? { x: a.safe[0] - a.content_at[0], y: a.safe[1] - a.content_at[1], w: a.safe[2], h: a.safe[3] }
    : { x: 0, y: 0, w: a.content[0], h: a.content[1] };
}

/* đặt 1 element: x,y = TÂM THÂN (%) — bw/bh = cỡ THÂN (px, khuyên dùng: decor tràn
   không xô layout); w/h = cỡ cả content. nine: co giãn 9-slice. txt: chữ đè giữa. */
function put(scr, name, o) {
  const a = A(name);
  if (!a) return null;
  const [cw, ch] = a.content, sf = safeOf(a);
  let w, h, dx = 0, dy = 0;
  if (o.w && o.h) { w = o.w; h = o.h; }                 // panel/row: ép đúng cỡ cho trước
  else {
    const s = o.bw ? o.bw / sf.w : o.bh ? o.bh / sf.h : o.w ? o.w / cw : o.h / ch;
    w = cw * s; h = ch * s;
    // dịch sao cho TÂM THÂN (không phải tâm bbox) rơi đúng (x,y)
    dx = (cw / 2 - (sf.x + sf.w / 2)) * s; dy = (ch / 2 - (sf.y + sf.h / 2)) * s;
  }
  const d = document.createElement("div");
  d.className = "it";
  d.style.cssText = `left:${o.x}%;top:${o.y}%;width:${w}px;height:${h}px;` +
    `margin:${dy}px 0 0 ${dx}px;` + (o.z ? `z-index:${o.z};` : "") + (o.css ?? "");
  if (o.nine && a.slice9) {
    const [l, t, r, b] = a.slice9, ns = Math.min(1, h / ch, w / cw);
    d.style.borderStyle = "solid";
    d.style.borderWidth = `${t * ns}px ${r * ns}px ${b * ns}px ${l * ns}px`;
    d.style.borderImage = `url("${src(name)}") ${t} ${r} ${b} ${l} fill stretch`;
  } else {
    d.innerHTML = `<img src="${src(name)}" alt="">`;
  }
  if (o.txt) {
    const t = document.createElement("div");
    t.className = "tx";
    t.style.cssText = o.tcss ?? "font-size:16px";
    t.textContent = o.txt;
    d.appendChild(t);
  }
  scr.appendChild(d);
  return d;
}
/* đo độ sáng trung bình của 1 asset (cache theo src) → chữ đè lên nó tự chọn
   màu tối/sáng, kit nào cũng đọc được (row trắng ipay, row đỏ tet...) */
const LUM = {};
function lumOf(name) {
  const key = src(name);
  if (!(key in LUM)) LUM[key] = new Promise(res => {
    const im = new Image();
    im.onload = () => {
      const c = document.createElement("canvas");
      c.width = c.height = 24;
      const g = c.getContext("2d");
      g.drawImage(im, 0, 0, 24, 24);
      const d = g.getImageData(0, 0, 24, 24).data;
      let s = 0, n = 0;
      for (let i = 0; i < d.length; i += 4)
        if (d[i + 3] > 128) { s += 0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2]; n++; }
      res(n ? s / n / 255 : 0);
    };
    im.onerror = () => res(0);
    im.src = key;
  });
  return LUM[key];
}
async function autoInk(el, name) {
  if (!el) return;
  const ink = (await lumOf(name)) > 0.55
    ? "color:#1c3560;text-shadow:none"
    : "color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.65)";
  el.querySelectorAll(".tx").forEach(t => t.style.cssText += ";" + ink);
}

function text(scr, txt, x, y, css, onAsset) {
  const t = document.createElement("div");
  t.className = "free";
  t.style.cssText = `left:${x}%;top:${y}%;` + (css ?? "font-size:15px");
  t.textContent = txt;
  scr.appendChild(t);
  // chữ nằm trên 1 asset sáng màu → tự đổi mực tối (đo độ sáng như autoInk)
  if (onAsset && A(onAsset)) lumOf(onAsset).then(l => {
    if (l > 0.55) t.style.cssText += ";color:#1c3560;text-shadow:none";
  });
  return t;
}
function bg(scr, name, dim) {
  if (A(name)) scr.innerHTML = `<img class="bg" src="${src(name)}" alt="">`;
  if (dim) scr.innerHTML += `<div class="dim"></div>`;
}
const pose = p => A(`pose-${CHAR}-${p}`) ? `pose-${CHAR}-${p}` : null;

/* ============================ 4 màn cơ bản ============================ */
function scrHome(scr) {
  /* căn theo CONTRACT của bg-home: podium ở NỬA DƯỚI (mascot đứng lên đó),
     vùng giữa-trên để trống cho tiêu đề (ribbon), UI điều khiển dồn xuống đáy */
  bg(scr, "25-bg-home");
  autoInk(put(scr, "50-counter-pill", { x: 20, y: 6, w: 110, txt: "1.250 ⭐", tcss: "font-size:13px;padding-left:38px" }), "50-counter-pill");
  put(scr, "04-btn-circle", { x: 90, y: 6, w: 44, txt: "⚙", tcss: "font-size:18px" });
  put(scr, "10-popup-ribbon", { x: 50, y: 14, bw: 250, txt: "SĂN QUÀ MAY MẮN", tcss: "font-size:15px;margin-top:-6px" });
  // thân mascot cao 225px, tâm y57% → chân chạm mặt podium (~76%, contract: podium nửa dưới)
  if (pose("wave")) put(scr, pose("wave"), { x: 50, y: 57, bh: 225 });
  const tr = put(scr, "07-progress-track", { x: 50, y: 82.5, w: 240, z: 2 });
  if (tr) put(scr, "08-progress-fill",
    { x: 40, y: 82.5, w: 144, h: parseFloat(tr.style.height) * 0.62, z: 2 });
  // chữ đè TRÊN track (nền track tối, đọc được ở mọi kit — không thả lên bg)
  text(scr, "Lượt chơi: 3/5", 50, 82.5, "font-size:11.5px;z-index:3");
  put(scr, "01-btn-pill-red", { x: 50, y: 91, w: 250, nine: true, z: 2, txt: "CHƠI NGAY", tcss: "font-size:19px" });
}

function scrBoard(scr) {
  bg(scr, "26-bg-play", true);
  put(scr, "22-board-panel", { x: 50, y: 54, w: 350, h: 480, nine: true });
  put(scr, "10-popup-ribbon", { x: 50, y: 9, w: 250, z: 2, txt: "BẢNG XẾP HẠNG", tcss: "font-size:14px;margin-top:-6px" });
  put(scr, "41-btn-close", { x: 91, y: 17, w: 38, z: 2 });
  put(scr, "46-rank-badge-2", { x: 27, y: 23.5, bw: 52, z: 2 });
  put(scr, "45-rank-badge-1", { x: 50, y: 22, bw: 62, z: 2 });
  put(scr, "47-rank-badge-3", { x: 73, y: 23.5, bw: 52, z: 2 });
  const RTX = "font-size:13px";
  const rows = [["Minh Anh", "12.480"], ["Hải Đăng", "11.020"], ["Thu Trang", "9.750"]];
  rows.forEach(([n, p], i) => {
    const r = put(scr, "48-rank-row", { x: 50, y: 35 + i * 10.5, w: 300, h: 52, nine: true, z: 2 });
    if (r) r.innerHTML += `<div class="tx" style="left:16px;right:auto;${RTX}">${i + 1}.  ${n}</div>
      <div class="tx" style="right:18px;left:auto;${RTX}">${p}</div>`;
    autoInk(r, "48-rank-row");
  });
  const me = put(scr, "49-rank-row-self", { x: 50, y: 70, w: 300, h: 54, nine: true, z: 2 });
  if (me) me.innerHTML += `<div class="tx" style="left:16px;right:auto;${RTX}">27.  Bạn</div>
    <div class="tx" style="right:18px;left:auto;${RTX}">8.450</div>`;
  autoInk(me, "49-rank-row-self");
  put(scr, "02-btn-pill-blue", { x: 50, y: 82, w: 220, nine: true, z: 2, txt: "CHƠI TIẾP", tcss: "font-size:16px" });
  if (pose("view-34")) put(scr, pose("view-34"), { x: 14, y: 92, bh: 100, z: 3 });
}

function scrGift(scr) {
  bg(scr, "26-bg-play", true);
  put(scr, "16-fx-burst", { x: 50, y: 34, w: 300 });
  put(scr, "09-popup-panel-short", { x: 50, y: 56, w: 340, h: 310, nine: true });
  put(scr, "51-reward-giftbox-open", { x: 50, y: 34, bh: 140, z: 2 });
  text(scr, "CHÚC MỪNG!", 50, 49.5, "font-size:20px;z-index:2", "09-popup-panel-short");
  autoInk(put(scr, "14-reward-voucher", { x: 50, y: 58, bw: 140, z: 2, txt: "50.000đ", tcss: "font-size:15px" }), "14-reward-voucher");
  text(scr, "Bạn nhận được 1 voucher", 50, 66, "font-size:12.5px;z-index:2", "09-popup-panel-short");
  put(scr, "02-btn-pill-blue", { x: 50, y: 75.5, w: 210, nine: true, z: 2, txt: "NHẬN QUÀ", tcss: "font-size:16px" });
  if (pose("cheer")) put(scr, pose("cheer"), { x: 85, y: 91, bh: 118, z: 3 });
}

function scrEnvelope(scr) {
  bg(scr, "25-bg-home", true);
  put(scr, "16-fx-burst", { x: 50, y: 42, w: 320 });
  /* phong bì PART-BASED: nắp (flap) ghép khớp bề ngang THÂN body — đo bằng safe zone
     nên trang trí tràn không làm lệch khớp; game mở nắp runtime */
  const ba = A("52-envelope-body"), fa = A("53-envelope-flap");
  if (ba) {
    const bs = safeOf(ba), BH = 220, BW = BH * bs.w / bs.h;
    put(scr, "52-envelope-body", { x: 50, y: 45, bh: BH, z: 2 });
    if (fa) {
      const fs = safeOf(fa), FH = BW * fs.h / fs.w;
      const topPct = 45 - BH / 600 * 50;               // mép trên thân (%)
      put(scr, "53-envelope-flap", { x: 50, y: topPct + FH / 600 * 50, bw: BW, z: 3 });
    }
  }
  text(scr, "LÌ XÌ MAY MẮN", 50, 12, "font-size:21px");
  text(scr, "Chạm để mở phong bì", 50, 68.5, "font-size:13px;z-index:4");
  put(scr, "01-btn-pill-red", { x: 50, y: 79, w: 230, nine: true, z: 4, txt: "MỞ LÌ XÌ", tcss: "font-size:18px" });
  if (pose("hold-gift")) put(scr, pose("hold-gift"), { x: 15, y: 91, bh: 118, z: 4 });
}

const SCREENS = [
  ["Màn HOME", scrHome], ["Bảng xếp hạng", scrBoard],
  ["Mở quà", scrGift], ["Mở lì xì", scrEnvelope],
];

/* ============================ khung + copy Figma ============================ */
function render() {
  AM = Object.fromEntries(M.styles[KIT].assets.map(a => [a.file.replace(".png", ""), a]));
  const chars = [...new Set(M.styles[KIT].assets.map(a => /^pose-(.+?)-/.exec(a.file)?.[1]).filter(Boolean))];
  const cs = $("#charSel");
  cs.innerHTML = chars.map(c => `<option ${c === CHAR ? "selected" : ""}>${c}</option>`).join("") ||
    "<option value=''>— không có character —</option>";
  CHAR = chars.includes(CHAR) ? CHAR : chars[0];
  const shots = $("#shots");
  shots.innerHTML = "";
  for (const [name, fn] of SCREENS) {
    const w = document.createElement("div");
    w.className = "wrap";
    w.innerHTML = `<div class="cap"><span>${name}</span><button>📋 Figma</button></div>`;
    const scr = document.createElement("div");
    scr.className = "screen";
    fn(scr);
    w.appendChild(scr);
    w.querySelector("button").onclick = () => copyScreens([[name, scr]]);
    shots.appendChild(w);
  }
}
async function copyScreens(list) {
  try {
    const docs = [];
    for (const [name, scr] of list)
      docs.push(await figmaH2D.captureElement(scr, { name: `${KIT} · ${name}` }));
    await figmaH2D.writeFigmaClipboard(docs, { source: "kit-screens" });
    $("#msg").textContent = `📋 đã copy ${docs.length} màn (${KIT}) — sang Figma Cmd+V`;
  } catch (e) { $("#msg").textContent = "❌ " + (e.message ?? e); }
}
$("#copyAll").onclick = () =>
  copyScreens([...$("#shots").querySelectorAll(".wrap")].map((w, i) =>
    [SCREENS[i][0], w.querySelector(".screen")]));

async function boot() {
  M = await (await fetch("kits/manifest.json?" + Date.now())).json();
  const kits = Object.keys(M.styles);
  KIT = qs.get("kit") && kits.includes(qs.get("kit")) ? qs.get("kit") : kits[0];
  $("#kitSel").innerHTML = kits.map(k => `<option ${k === KIT ? "selected" : ""}>📦 ${k}</option>`).join("");
  $("#kitSel").onchange = e => { KIT = e.target.value.replace("📦 ", ""); history.replaceState(0, "", `?kit=${KIT}`); render(); };
  $("#charSel").onchange = e => { CHAR = e.target.value; render(); };
  render();
}
boot();
</script>
</body>
</html>
