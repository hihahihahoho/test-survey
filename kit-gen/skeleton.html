<!doctype html>
<meta charset="utf-8">
<title>skeleton — khung xương layout từ styles.json</title>
<!-- ============================================================================
  KHUNG XEM, KHÔNG PHẢI BỘ DỰNG.

  Toàn bộ hình học nằm ở skeleton-svg.js (`KITSKEL.sheetToSvg`). Trang này chỉ
  nhúng NGUYÊN VĂN chuỗi SVG đó — đúng chuỗi mà render-skeleton.mjs đưa cho
  @resvg/resvg-wasm để ghi skeleton/<id>.png. Trình duyệt và renderer ăn chung
  một input nên không thể trôi khỏi nhau.

  ⚠ ĐỪNG thêm luật CSS nào tác động lên nội dung sheet (kích thước, viền, vị trí,
  chữ, bóng đổ, flex/grid…). resvg KHÔNG đọc CSS của trang; mọi thứ vẽ bằng CSS ở
  đây sẽ có trên màn hình mà KHÔNG có trong ảnh gửi cho codex. Muốn đổi hình dạng
  khung xương thì sửa skeleton-svg.js. tests/test_skeleton_svg.py khoá điều này.

  Mở tay qua http để xem (tự fetch styles.json). Ảnh thật do
  `node render-skeleton.mjs` sinh, không qua trang này.
============================================================================ -->
<style>
  /* Chỉ trang trí KHUNG XEM: nền trang, canh giữa, nhãn sheet. Không luật nào
     chạm vào bên trong <svg>.

     CARO Ở ĐÂY LÀ CỦA TRANG, KHÔNG PHẢI CỦA ẢNH. Sheet đã bỏ rect nền (nền phải
     trong suốt thì model mới trả về alpha thật — xem khối "NỀN SHEET" trong
     skeleton-svg.js). Trong suốt trên nền trắng thì không nhìn được gì, nên trang
     trải caro DƯỚI tấm SVG. Caro nằm ở CSS ⇒ resvg không đọc ⇒ nó không thể lọt
     vào ảnh gửi cho model. Đừng bao giờ chuyển nó vào SVG cho "tiện". */
  body { margin: 0; background: #fff; font-family: sans-serif }
  .sheet {
    margin: 24px auto; width: max-content;
    /* conic chứ không phải hai lớp linear: kiểu linear cần thuộc tính lệch ô
       `background-…-offset`, mà tên đó chứa đúng chuỗi mà ViewerDriftTest cấm
       (nó quét chữ, không parse CSS). Lệnh cấm ấy đúng — không nới nó ra chỉ vì
       một cái caro trang trí, nên đổi cách vẽ caro. */
    background-image: repeating-conic-gradient(#e4e4e4 0 25%, #ffffff 0 50%);
    background-size: 16px 16px;
  }
  h4 { margin: 16px auto 0; width: max-content }
</style>
<div id="sheets"></div>
<script src="silhouettes.js"></script>
<script src="skeleton-svg.js"></script>
<script>
function build(cfg) {
  const root = document.getElementById("sheets");
  root.innerHTML = "";
  for (const sh of cfg.sheets) {
    const title = document.createElement("h4");
    title.textContent = `${sh.id} — ${sh.grid.cols}×${sh.grid.rows}`;
    root.appendChild(title);
    const div = document.createElement("div");
    div.className = "sheet";
    div.id = "sheet-" + sh.id;
    /* Viewer phải nhìn đúng attachment production: bật cùng grid/safe/no-bias v16.
       Contract không bị sửa; đây chỉ là option của renderer. */
    div.innerHTML = KITSKEL.sheetToSvg({
      ...sh,
      gridGuide: { ...KITSKEL.GRID_GUIDE, enabled: true },
    });
    root.appendChild(div);
  }
}

if (location.protocol !== "file:")
  fetch("styles.json").then(r => r.json()).then(build).catch(() => {});
window.__build = build;
</script>
